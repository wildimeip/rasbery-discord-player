name: Release image
# main -> :stable (what the Pi runs), v* tags -> :<tag> as well.
# The weekly rebuild picks up a new yt-dlp: YouTube changes often and old yt-dlp versions break.
on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
  build:
    # Each architecture builds on its own native runner, at the same time (emulating arm64
    # with QEMU took ~5 minutes). The images are pushed without a tag; `publish` joins them.
    needs: test
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Names
        id: names
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rasbery-discord-player" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          # The weekly run must not reuse the cached pip layer, or yt-dlp stays old.
          no-cache: ${{ github.event_name == 'schedule' }}
          build-args: APP_VERSION=${{ steps.names.outputs.version }}
          outputs: type=image,name=${{ steps.names.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - name: Remember the image
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
  publish:
    # One tag for both architectures: Docker on the Pi picks arm64 from it.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the image
        working-directory: ${{ runner.temp }}/digests
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rasbery-discord-player"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags=(-t "$image:$GITHUB_REF_NAME")
          else
            tags=(-t "$image:stable" -t "$image:sha-${GITHUB_SHA::7}")
          fi
          sources=()
          for digest in *; do sources+=("$image@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${tags[1]}"
