name: Release image
# main -> :stable (what the Pi runs), v* tags -> :<tag> as well.
# The weekly rebuild picks up a new yt-dlp: YouTube changes often and old yt-dlp versions break.
on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rasbery-discord-player"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tags=$image:$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$image:stable,$image:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          # The weekly run must not reuse the cached pip layer, or yt-dlp stays old.
          no-cache: ${{ github.event_name == 'schedule' }}
          build-args: APP_VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
